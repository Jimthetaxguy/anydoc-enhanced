[workspace]
resolver = "2"
members = [
    "crates/pdf-inspector-skillkit",
    "crates/pdf-inspector-mcp",
]

[workspace.dependencies]
pdf-inspector = "=1.24.0"
# The parser pdf-inspector uses, for the local page scan; kept on its version.
lopdf = "0.45"
anydoc = "=0.2.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
quick-xml = "0.41.0"
# Shared with AnyDoc, so preflight checks decode XML parts exactly as it does.
encoding_rs = "0.8.35"

# Tests drive the debug server under its production 30-second tool timeout;
# unoptimized, pdf-inspector and its parser take most of that on a large
# PDF, so dependencies build optimized while the workspace stays quick to
# rebuild.
[profile.dev.package."*"]
opt-level = 2
