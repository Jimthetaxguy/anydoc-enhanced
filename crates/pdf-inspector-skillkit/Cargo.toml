[package]
name = "pdf-inspector-skillkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Skillkit library wrapping pdf-inspector with tax/SEC/IRC domain helpers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jimthetaxguy/anydoc-enhanced"
homepage = "https://github.com/Jimthetaxguy/anydoc-enhanced"
readme = "../../README.md"
keywords = ["pdf", "mcp", "tax", "sec", "extraction"]
categories = ["text-processing", "command-line-utilities"]

[dependencies]
anydoc = { workspace = true }
pdf-inspector = { workspace = true }
lopdf = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
quick-xml = { workspace = true }
encoding_rs = { workspace = true }
tokio = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
log = "0.4"
